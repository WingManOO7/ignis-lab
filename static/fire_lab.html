<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGNIS LAB fire lab</title>
<!-- IGNIS LAB interactive "fire lab": Earth lab -> orbit -> cabin (FLEX chamber + cabin wiring).
     The FLEX chamber is driven live by window.IGNIS.predict (ignis/sim_assets/ignis_model.js, the trained FLEX
     models evaluated in the browser). Everything else is illustrative.
     three.js 0.160.0 (MIT): the copy vendored in static/vendor/three-0.160.0 (Streamlit static serving), else the
     same pinned files from cdn.jsdelivr.net with SRI. See the loader script before the scene module.
     The narrator voice is OFF until the user clicks "Voice off" (opt-in); the text narrator always runs.
     Test URL options: ?place=earth|orbit|cabin|chamber|wiring &gravity=off &preset=iss|lunar|exploration
     &fuel=Heptane|Methanol &o2=0.34 &p=1.0 &d0=3 &fan=on|off &spark=1 &suppress=<s> &t=<s> (simulate t s, then hold) &voice=1 -->
<style>
:root{
  --bg:#04060b; --panel:rgba(9,13,22,.8); --line:rgba(140,170,220,.18); --txt:#e7edf6; --mut:#93a0b4;
  --acc:#4fa3ff; --model:#3fd6c5; --runs:#78b8ff; --ill:#c4a8ff; --inp:#a3adbd;
  --green:#3ddc84; --amber:#ffb020; --red:#ff5a5f; --fire:#ff9a3c;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font:clamp(11.5px,.45vw + 7px,13.5px)/1.35 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0b1220 0%,#04060b 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#gl.grey{filter:grayscale(1) brightness(.62)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.5) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#flashOv{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,236,190,.95),rgba(255,140,40,.5) 45%,transparent 75%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.tag{display:inline-block;font:700 8.5px/1 var(--mono);letter-spacing:.04em;padding:2px 5px;cursor:help;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.tag.model{color:var(--model);border-color:rgba(63,214,197,.45);background:rgba(63,214,197,.09)}
.tag.runs{color:var(--runs);border-color:rgba(120,184,255,.45);background:rgba(120,184,255,.09)}
.tag.ill{color:var(--ill);border-color:rgba(196,168,255,.42);background:rgba(196,168,255,.08)}
.tag.inp{color:var(--inp);border-color:rgba(163,173,189,.35);background:rgba(163,173,189,.07)}
.tag.red{color:#ff9a9c;border-color:rgba(255,90,95,.5);background:rgba(255,90,95,.1)}
/* ---- cinema layout: slim top bar, context actions, result chip, ONE drawer at a time, narrator ---- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#top{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:10px;padding:6px 10px;z-index:4;
  background:linear-gradient(180deg,rgba(3,5,10,.82),rgba(3,5,10,.35) 75%,transparent);animation:fadein .6s ease both}
#brandbox{min-width:0;flex:0 1 auto;display:flex;flex-direction:column;gap:3px;pointer-events:none}
#brand{font:700 clamp(9px,.35vw + 5px,10.5px)/1 inherit;letter-spacing:.2em;color:var(--acc);text-transform:uppercase;white-space:nowrap}
#brand b{color:#ffb35c;font-weight:700}
#ttl{display:flex;align-items:center;gap:5px;min-width:0;pointer-events:auto}
#ptitle{font:650 clamp(11.5px,.5vw + 7px,14px)/1.15 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#ptags{display:flex;gap:3px;flex:none}
#ptags .tag{font-size:7.5px;padding:1px 4px}
#crumbs{flex:1 1 auto;display:flex;justify-content:center;gap:3px;align-items:center;min-width:0}
#crumbs .sep{color:#4d5a70;font-size:10px}
.crumb{appearance:none;border:1px solid rgba(160,190,240,.2);background:rgba(20,28,44,.7);color:var(--mut);font:650 clamp(10px,.3vw + 6.5px,11px)/1 inherit;
  padding:5px 9px;border-radius:20px;cursor:pointer;letter-spacing:.03em;white-space:nowrap}
.crumb.cur{color:#04101f;background:var(--acc);border-color:transparent}
.crumb:hover:not(.cur){color:var(--txt);border-color:rgba(160,190,240,.45)}
#tools{display:flex;gap:5px;flex:none}
.tbtn{appearance:none;border:1px solid rgba(160,190,240,.24);background:rgba(16,22,36,.78);color:var(--txt);height:30px;padding:0 10px;border-radius:9px;
  font:650 clamp(10.5px,.3vw + 7px,12px)/1 inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;backdrop-filter:blur(8px)}
.tbtn:hover{background:rgba(52,72,112,.9)} .tbtn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tbtn i{font-style:normal;font-size:13px;line-height:1}
.tbtn.act{background:rgba(79,163,255,.28);border-color:rgba(79,163,255,.8)}
.tbtn.story{background:linear-gradient(180deg,rgba(255,154,60,.32),rgba(255,120,30,.2));border-color:rgba(255,170,90,.7);color:#ffe2c4}
.tbtn.story.act{background:rgba(255,90,95,.25);border-color:rgba(255,90,95,.7);color:#ffd0d2}
#bShow{position:absolute;right:10px;top:8px;z-index:5;display:none;opacity:.55} #bShow:hover{opacity:1}
/* context actions (bottom-left) */
#actions{position:absolute;left:12px;bottom:clamp(66px,9vh,84px);max-width:min(560px,calc(100% - 24px));z-index:3}
.acts{display:none;flex-wrap:wrap;gap:6px;align-items:center}
.acts.on{display:flex;animation:rise .45s ease both}
.acts .btn{box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.rbtn{appearance:none;width:clamp(44px,4.2vw,54px);height:clamp(44px,4.2vw,54px);border-radius:50%;border:1px solid rgba(160,190,240,.3);background:rgba(16,22,36,.82);
  color:var(--txt);cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;
  box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(8px);font:inherit}
.rbtn i{font-style:normal;font-size:clamp(14px,1.2vw,17px);line-height:1}
.rbtn span{font:650 8.5px/1 inherit;letter-spacing:.02em;color:#c9d2e0}
.rbtn:hover{background:rgba(52,72,112,.95)} .rbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rbtn.spark{border-color:rgba(255,170,90,.7);background:rgba(255,140,40,.2)} .rbtn.spark i{color:#ffcf7a}
.rbtn.on{border-color:rgba(63,214,197,.7);background:rgba(63,214,197,.18)} .rbtn.off{border-color:rgba(255,90,95,.6);background:rgba(255,90,95,.14)}
.rbtn.cold{border-color:rgba(160,220,255,.6);background:rgba(160,220,255,.12)}
.fstate{font-size:11px;color:var(--mut);background:rgba(5,8,15,.7);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.fstate b{font:700 11.5px/1 var(--mono);color:#ffd2a6}
/* result chip (chamber) */
#chip{position:absolute;right:10px;top:50px;z-index:3;display:none;max-width:min(300px,calc(100% - 20px));cursor:pointer;
  background:rgba(5,8,15,.78);border:1px solid var(--line);border-radius:12px;padding:6px 10px;backdrop-filter:blur(9px)}
#chip.on{display:block;animation:rise .45s ease both}
#chip:hover{border-color:rgba(160,190,240,.45)}
#chip .light{padding:0}
#chip .nums{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11.5px;color:#c9d2e0;margin-top:3px}
#chip .nums b{font:700 12px/1 var(--mono);color:#fff}
#chip .scope{font-size:10px;color:var(--mut);margin-top:3px}
/* drawers: one open at a time; Esc or a click outside closes */
.drawer{position:absolute;top:50px;bottom:clamp(66px,9vh,84px);width:min(300px,calc(100% - 24px));z-index:6;display:flex;flex-direction:column;
  background:rgba(7,10,18,.9);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(0,0,0,.55);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;opacity:0;visibility:hidden}
.drawer.left{left:10px;transform:translateX(-110%)} .drawer.right{right:10px;transform:translateX(110%)}
.drawer.open{transform:none;opacity:1;visibility:visible}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px 12px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.06em}
.dhead .x{appearance:none;border:0;background:none;color:var(--mut);font-size:14px;cursor:pointer;padding:2px 6px;border-radius:6px} .dhead .x:hover{color:#fff;background:rgba(255,255,255,.08)}
.dbody{overflow:auto;scrollbar-width:thin;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0}
/* "click me" pulse on clickable 3D objects */
#pulses{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pulse{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .4s}
.pulse i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,200,130,.85);animation:pulse 2.2s ease-out infinite}
.pulse i+i{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* clean presentation view (Panels / H): only the narrator, the footer and honesty overlays stay */
#app.clean .ui,#app.clean #pulses,#app.clean #scalebar{display:none !important}
#app.clean #bShow{display:inline-flex}
#toast{position:absolute;left:50%;top:52px;transform:translate(-50%,-6px);z-index:8;max-width:calc(100% - 24px);opacity:0;pointer-events:none;
  background:rgba(10,14,24,.95);border:1px solid rgba(79,163,255,.6);border-radius:10px;padding:8px 12px;font-size:12.5px;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#toast a{color:#9ccaff;font-weight:700;margin-left:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px 10px;backdrop-filter:blur(9px)}
.hint{font-size:10.5px;color:var(--mut);margin-top:7px;display:flex;align-items:center;gap:6px}
.hint .bandkey{display:inline-block;width:18px;height:5px;border-radius:3px;background:rgba(63,214,197,.75)}
.status{margin-top:8px;font-size:12px;color:var(--mut)} .status b{font:700 12.5px/1 var(--mono);color:#ffd2a6}
.link{appearance:none;background:none;border:0;color:var(--acc);font:600 11px/1 inherit;cursor:pointer;padding:4px 0 0}
.facts-btn{align-self:flex-end}
.mini .light{padding-bottom:2px} .mini .tag{margin-top:4px}
.ctl .lab b.out{color:#ff8f92}
.card h4{margin:0 0 5px;font:700 10px/1.2 inherit;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px;align-items:center}
.card p{margin:0 0 8px;color:#cdd6e5;font-size:12.5px;line-height:1.4}
.card .tg{margin:3px 0 7px}
.panel{display:none}
.panel.on{display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:1px solid rgba(160,190,240,.24);background:rgba(30,40,62,.7);color:var(--txt);min-height:30px;
  padding:6px 10px;border-radius:8px;font:650 12px/1.2 inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{background:rgba(52,72,112,.85)} .btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.go{background:linear-gradient(180deg,#5aaeff,#3a8cf0);color:#03101f;border-color:transparent}
.btn.go:hover{filter:brightness(1.08)}
.btn.warn{background:rgba(255,154,60,.16);border-color:rgba(255,154,60,.55);color:#ffd2a6}
.btn.cold{background:rgba(160,220,255,.12);border-color:rgba(160,220,255,.5);color:#d4f0ff}
.btn.on{background:rgba(63,214,197,.2);border-color:rgba(63,214,197,.6);color:#bff7ef}
.btn.off{background:rgba(255,90,95,.14);border-color:rgba(255,90,95,.5);color:#ffc2c4}
.btn.sm{min-height:24px;padding:3px 8px;font-size:11px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .btn{flex:1 1 auto}
.col{display:flex;flex-direction:column;gap:6px}
/* sliders */
.ctl{margin:6px 0 1px}
.ctl .lab{display:flex;justify-content:space-between;font-size:11.5px;color:#c9d2e0}
.ctl .lab b{font:700 12px/1 var(--mono);color:#fff}
.ctl .rng-note{font:600 9.5px/1.2 var(--mono);color:var(--model);margin-top:2px;opacity:.9}
.ctl .rng-note.out{color:#ff9a9c}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:3px 0 0;cursor:pointer;--trk:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--trk)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--trk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 3px rgba(79,163,255,.45)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(79,163,255,.45)}
select{width:100%;background:rgba(20,28,44,.9);color:var(--txt);border:1px solid rgba(160,190,240,.25);border-radius:7px;padding:5px 7px;font:600 12px/1.2 inherit}
.seg2{display:flex;gap:4px}
.seg2 .btn{flex:1;min-height:26px;padding:3px 6px;font-size:11.5px}
.seg2 .btn.sel{background:rgba(79,163,255,.28);border-color:rgba(79,163,255,.8)}
.acts .btn.sel,.rbtn.sel{outline:2px solid rgba(79,163,255,.85);outline-offset:1px}
.legend{font-size:10.5px;color:var(--mut);margin-top:6px;display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px;background:rgba(63,214,197,.6)}
.warnline{font-size:11.5px;color:#ffcf7a;margin-top:6px}
/* details drawer content */
#hud .card,#ctlBody .card{background:rgba(14,20,34,.7);backdrop-filter:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0}
.row .k{color:var(--mut);font-size:12px}
.row .v{font:650 12.5px/1.2 var(--mono);text-align:right;white-space:nowrap}
.big{font:750 20px/1.1 var(--mono);color:#fff}
.light{display:flex;align-items:flex-start;gap:8px;padding:2px 0 4px}
.light i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor;margin-top:2px}
.light b{font:800 12px/1.2 var(--mono);letter-spacing:.05em}
.light span{color:#c9d2e0;font-size:11.5px;line-height:1.3}
.light.green{color:var(--green)} .light.amber{color:var(--amber)} .light.red{color:var(--red)}
.reasons{margin:2px 0 4px;padding-left:14px;color:#e6c9cb;font-size:11px}
table.runs{width:100%;border-collapse:collapse;font:600 10.5px/1.3 var(--mono);margin-top:4px}
table.runs td{padding:2px 3px;border-top:1px solid rgba(140,170,220,.1);color:#cfe0ff;white-space:nowrap}
table.runs td.o{color:var(--mut)} table.runs td.o.Extinction{color:#9fd0ff} table.runs td.o.Disruption{color:#ffcf7a} table.runs td.o.Completion{color:#a4f0c8}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:5px}
.live div{background:rgba(120,150,200,.08);border-radius:7px;padding:4px 7px}
.live small{display:block;color:var(--mut);font-size:10px;letter-spacing:.06em}
.live b{font:700 14px/1.15 var(--mono);color:#fff}
#plot{width:100%;height:92px;display:block}
.pfoot{font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.35}
.pfoot b{color:#dfe7f3;font-weight:600}
.facts{margin:0;padding-left:15px;font-size:11.5px;color:#cdd6e5;line-height:1.4}
.facts li{margin:3px 0}
.facts .src{color:var(--mut);font-size:10.5px}
.state{font:700 13px/1.2 var(--mono);color:#ffd2a6}
/* narrator */
#narr{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;width:min(640px,calc(100% - 24px));display:flex;align-items:center;gap:10px;z-index:4;
  background:rgba(5,8,15,.8);border:1px solid rgba(255,179,92,.25);border-radius:12px;padding:6px 10px;backdrop-filter:blur(9px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
#narr .who{display:none}
#narrText{flex:1;font-size:clamp(12px,.45vw + 7.5px,15px);line-height:1.38;min-height:19px;color:#f1f4fa}
#narrText.in{animation:fadein .3s ease both}
#voiceSel{width:auto;max-width:132px;height:22px;padding:0 4px;font:600 10.5px/1 inherit;border-radius:6px;background:rgba(20,28,44,.9)}
#narrStep{color:#ffb35c;font-size:11px}
#narrText .cur{display:inline-block;width:7px;height:14px;background:#ffb35c;margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#narr .nbtns{display:flex;gap:4px}
#narr .btn{min-height:22px;padding:2px 8px;font-size:10.5px}
#footer{position:absolute;left:12px;right:12px;bottom:4px;text-align:center;font-size:clamp(9px,.25vw + 6.5px,10.5px);color:#7f8ba0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:4}
/* 3D labels */
.lbl{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s;will-change:transform;pointer-events:none}
.lbl .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 9px 2px rgba(190,215,255,.8)}
.lbl .stem{position:absolute;left:-.5px;bottom:5px;width:1px;height:24px;background:linear-gradient(to top,rgba(210,225,255,.85),rgba(210,225,255,.15))}
.lbl .box{position:absolute;left:0;bottom:29px;transform:translateX(calc(-50% + var(--dx,0px)));background:rgba(5,8,15,.72);
  border:1px solid rgba(160,190,240,.22);border-radius:7px;padding:3px 7px;font-size:11.5px;line-height:1.3;
  width:max-content;max-width:220px;display:flex;align-items:center;gap:6px}
.lbl .box .tag{font-size:7.5px;padding:1px 4px}
.lbl.down .stem{top:5px;bottom:auto;background:linear-gradient(to bottom,rgba(210,225,255,.85),rgba(210,225,255,.15))}
.lbl.down .box{top:29px;bottom:auto}
#tip{position:absolute;pointer-events:none;background:rgba(255,179,92,.95);color:#1a0d00;font:700 11px/1 inherit;padding:5px 8px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap}
/* overlays */
.notice{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 40px));display:none;pointer-events:none;
  background:rgba(22,6,10,.86);border:1px solid rgba(255,90,95,.6);border-radius:14px;padding:14px 16px;text-align:center;
  backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.notice h3{margin:0 0 6px;font-size:16px;color:#ff8f92}
.notice p{margin:4px 0;color:#e6d6d8;font-size:12.5px;line-height:1.45}
#redNote{top:32%;z-index:3}
#fallback{background:rgba(10,14,24,.92);border-color:rgba(79,163,255,.5);top:30%;pointer-events:auto;z-index:5}
#fallback h3{color:#9ccaff}
#scalebar{position:absolute;right:14px;bottom:clamp(70px,9.5vh,90px);text-align:right;font:600 10.5px/1 var(--mono);color:#cfe0ff;display:none}
#scalebar b{display:block;font-weight:700;font-size:9.5px;letter-spacing:.1em;color:rgba(170,200,255,.7);margin-bottom:6px}
#scalebar i{display:block;height:3px;background:#cfe0ff;margin:0 0 4px auto;border-left:1px solid #fff;border-right:1px solid #fff}
/* responsive: icon-only tools and shorter crumbs on narrow views; compact everything on short views */
@media (max-width:1180px){ .tbtn span{display:none} .tbtn{padding:0 9px} }
@media (max-width:860px){ #ptitle{display:none} .crumb{padding:5px 7px} #crumbs .sep{display:none} }
@media (max-width:640px){ #brandbox{display:none} #crumbs{justify-content:flex-start} #scalebar{display:none !important} }
@media (max-height:560px){

<script>/* IGNIS LAB - the trained FLEX models, evaluated in the browser so the 3D chamber reacts instantly.
 * The numbers in window.IGNIS_MODEL_DATA are exported from the saved scikit-learn models by
 * ignis/simulation.py (web_model_payload); tests/test_core.py checks this file reproduces
 * Python's predictions and traffic light exactly. Do not edit the maths without re-running that test.
 *
 * window.IGNIS.predict(q) with q = {fuel: "Heptane"|"Methanol", p_atm, x_o2, x_co2, x_he, d0_mm} returns
 * {p_ext, k, k_half, burn_time_s, light, light_text, reasons, nearest, d_ext_mm, n_ext_runs,
 *  cool_flame_possible, tested_ranges}
 */
(function () {
  "use strict";
  var D = window.IGNIS_MODEL_DATA;
  var NUM = ["p_atm", "x_o2", "x_co2", "x_he", "d0_mm"];

  function inputValue(q, n) {                     // hep_<c> = <c> for Heptane, 0 otherwise (ignis/features.py)
    return n.indexOf("hep_") === 0 ? (q.fuel === "Heptane" ? q[n.slice(4)] : 0) : q[n];
  }

  function features(m, q) {                       // OneHotEncoder(fuel) then StandardScaler(numeric columns)
    var x = m.fuel_categories.map(function (c) { return q.fuel === c ? 1 : 0; });
    m.num.forEach(function (n, i) { x.push((inputValue(q, n) - m.mean[i]) / m.scale[i]); });
    return x;
  }

  function linear(m, q) {
    var x = features(m, q), s = m.intercept;
    for (var i = 0; i < x.length; i++) s += m.coef[i] * x[i];
    return s;
  }

  function fmt(v) { return Number(v).toPrecision(3).replace(/\.?0+$/, ""); }

  function median(a) {
    if (!a.length) return null;
    var s = a.slice().sort(function (x, y) { return x - y; }), h = Math.floor(s.length / 2);
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  }

  function predict(qIn) {
    var q = {
      fuel: qIn.fuel, p_atm: +qIn.p_atm, x_o2: +qIn.x_o2, x_co2: +(qIn.x_co2 || 0),
      x_he: +(qIn.x_he || 0), d0_mm: +qIn.d0_mm
    };
    var ev = D.evidence[q.fuel];
    var pExt = 1 / (1 + Math.exp(-linear(D.clf, q)));
    var k = linear(D.k, q);

    // ---- traffic light: same rules as ignis/evidence.py evidence_lookup()
    var reasons = [];
    NUM.forEach(function (c) {
      var lo = ev.ranges[c][0], hi = ev.ranges[c][1], pad = D.tol * (hi - lo);
      if (!(q[c] >= lo - pad && q[c] <= hi + pad)) {
        reasons.push(c + " = " + fmt(q[c]) + " is outside the tested range " + fmt(lo) + "-" + fmt(hi));
      }
    });
    var z = NUM.map(function (n, i) { return (q[n] - ev.mean[i]) / ev.scale[i]; });
    var ranked = ev.runs.map(function (r) {
      var s = 0;
      for (var i = 0; i < z.length; i++) { var dz = r.z[i] - z[i]; s += dz * dz; }
      return { r: r, d: Math.sqrt(s) };
    }).sort(function (a, b) { return a.d - b.d; });
    var nearest = ranked.slice(0, 5).map(function (o) {
      var r = o.r;
      return { flex_id: r.flex_id, test_end: r.test_end, dext_mm: r.dext_mm, k_mm2_s: r.k_mm2_s,
               p_atm: r.p_atm, x_o2: r.x_o2, x_co2: r.x_co2, x_he: r.x_he, d0_mm: r.d0_mm,
               distance: Math.round(o.d * 100) / 100 };
    });
    var d0 = ranked[0].d, thr = ev.threshold, light, text;
    if (q.x_o2 + q.x_co2 + q.x_he > 1) {
      reasons.push("gas fractions add up to more than 1");
    }
    if (reasons.length) {
      light = "RED"; text = "RED - outside NASA's tested conditions: the model was never validated here";
    } else if (d0 > D.far * thr) {
      light = "RED"; text = "RED - no comparable NASA run: this combination of conditions was never tested";
      reasons.push("nearest run is " + d0.toFixed(2) + " scaled units away; 95% of real runs have a neighbour within " +
                   thr.toFixed(2) + " (each value is inside a tested range, but not together)");
    } else if (d0 > thr) {
      light = "AMBER"; text = "AMBER - inside the tested ranges, but no close NASA run";
      reasons.push("nearest run is " + d0.toFixed(2) + " scaled units away (95% of real runs have a neighbour within " +
                   thr.toFixed(2) + ")");
    } else {
      light = "GREEN"; text = "GREEN - close to real NASA runs";
    }
    // Disruption rule (same as ignis/evidence.py): the model never learned 'Disruption'
    var nDis = nearest.filter(function (r) { return r.test_end === "Disruption"; }).length;
    if (nDis >= 3) {
      reasons.push(nDis + " of " + nearest.length + " nearest NASA runs ended in Disruption (the droplet broke apart), " +
                   "an outcome the model was not trained on");
      if (light !== "RED") {
        if (nDis === nearest.length) {
          light = "RED"; text = "RED - every nearby NASA run ended in Disruption, an outcome the model was never trained on";
        } else if (light === "GREEN") {
          light = "AMBER"; text = "AMBER - most nearby NASA runs ended in Disruption, which the model was not trained on";
        }
      }
    }
    var ext = nearest.filter(function (r) { return r.test_end === "Extinction" && r.dext_mm > 0; })
                     .map(function (r) { return r.dext_mm; });
    return {
      p_ext: pExt, k: k, k_half: D.k_half, burn_time_s: k > 0 ? q.d0_mm * q.d0_mm / k : null,
      light: light, light_text: text, reasons: reasons, nearest: nearest,
      d_ext_mm: median(ext), n_ext_runs: ext.length,
      cool_flame_possible: q.fuel === "Heptane" && pExt >= 0.5,
      tested_ranges: ev.ranges
    };
  }

  window.IGNIS = { predict: predict, data: D };
})();

/* ====================================================================== 3D world */
function createWorld(THREE, PP, OrbitControls) {
  const canvas = $("gl");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  const SHOT = URLQ.has("place");
  let pr = Math.min(window.devicePixelRatio || 1, 1.75);
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const UP = V3(0, 1, 0);
  const U_SCALE = { value: 400 };
  const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpM = new THREE.Matrix4();
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const rand = (a, b) => a + Math.random() * (b - a);
  function canvasTex(w, h, draw, rep = [1, 1]) {
    const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rep[0], rep[1]); t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy()); return t;
  }

  /* ---------- shaders */
  const OUT = "\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n";
  const NOISE = `
  float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

    return mix(mix(hash12(i), hash12(i+vec2(1.,0.)), u.x), mix(hash12(i+vec2(0.,1.)), hash12(i+vec2(1.,1.)), u.x), u.y); }

  float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
  float vnoise3(vec3 p){ vec3 i = floor(p), f = fract(p); vec3 u = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), u.x), mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), u.x), u.y),
               mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), u.x), mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), u.x), u.y), u.z); }
  float fbm3(vec3 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a*vnoise3(p); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return v; }
  float fbm3e(vec3 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a*vnoise3(p); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return v; }
  `;
  const VS_UV = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  const FS_TEAR = `uniform float uTime, uIntensity, uAspect, uC, uR, uTop, uSeed, uBlue, uWobble; varying vec2 vUv;` + NOISE + `
  void main(){
    float t = uTime;
    vec2 p = vec2((vUv.x - 0.5) * uAspect, vUv.y);
    float hy = clamp((p.y - uC) / (uTop - uC), 0.0, 1.0);
    float n1 = fbm2(vec2(p.y * 3.0 - t * 2.1, t * 0.5 + uSeed));
    p.x -= (n1 - 0.5) * 0.10 * uWobble * hy * hy + 0.010 * uWobble * sin(t * 7.0 + uSeed) * hy;
    float flick = 1.0 + uWobble * 0.16 * (fbm2(vec2(t * 2.3, uSeed * 3.1)) - 0.5);
    float top = uC + (uTop - uC) * flick;
    float w;
    if (p.y < uC) { float q = (p.y - uC) / uR; w = uR * sqrt(max(1.0 - q*q, 0.0)); }
    else { float q = clamp((p.y - uC) / (top - uC), 0.0, 1.0); w = uR * pow(1.0 - q, 1.2) * (1.0 + 0.7 * q * (1.0 - q)); }
    float d = abs(p.x) / max(w, 1e-4);
    float e = fbm2(vec2(p.x * 16.0 / uAspect, p.y * 9.0 - t * 3.5));
    d += (e - 0.5) * 0.45 * smoothstep(0.25, 1.0, hy);
    float body = 1.0 - smoothstep(0.62, 1.04, d);
    float hq = clamp((p.y - (uC - uR)) / (top - (uC - uR)), 0.0, 1.0);
    vec3 cWhite = vec3(1.0, 0.90, 0.66) * 3.0, cYel = vec3(1.0, 0.56, 0.13) * 2.3, cRed = vec3(0.95, 0.22, 0.04) * 1.5, cBlue = vec3(0.18, 0.36, 1.0) * 2.0;
    vec3 col = mix(cYel, cWhite, (1.0 - smoothstep(0.1, 0.7, d)) * (1.0 - smoothstep(0.2, 0.65, hq)));
    col = mix(col, cRed, smoothstep(0.5, 1.0, hq));
    float blue = (1.0 - smoothstep(0.05, 0.30, hq)) * smoothstep(0.15, 0.85, d);
    col = mix(col, cBlue, clamp(blue * uBlue, 0.0, 1.0));
    float dz = 1.0 - smoothstep(0.0, 1.0, length(vec2(p.x / (uR * 0.42), (p.y - uC + uR * 0.2) / (uR * 0.85))));
    col *= 1.0 - 0.55 * dz;
    float a = body * (1.0 - smoothstep(0.86, 1.0, hq)) * smoothstep(0.0, 0.06, hq);
    float halo = exp(-max(d - 0.9, 0.0) * 2.2) * (1.0 - hq) * 0.10 * step(uC - uR, p.y);

  const VS_SPH = `varying vec3 vN; varying vec3 vV; varying vec3 vP;
  void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - wp.xyz); vP = position;
    gl_Position = projectionMatrix * viewMatrix * wp; }`;
  const FS_SPH = `uniform vec3 uRim, uCore; uniform float uIntensity, uTime, uPow, uNoise; varying vec3 vN; varying vec3 vV; varying vec3 vP;` + NOISE + `
  void main(){
    float ndv = abs(dot(normalize(vN), normalize(vV)));
    float rim = pow(1.0 - ndv, uPow);
    float shell = 0.07 / (ndv + 0.07);

  const FS_HALO = `uniform vec3 uColor; uniform float uIntensity, uK; varying vec2 vUv;
  void main(){ vec2 q = vUv * 2.0 - 1.0; float r2 = dot(q, q); float a = exp(-r2 * uK) * (1.0 - smoothstep(0.6, 1.0, sqrt(r2)));
    gl_FragColor = vec4(uColor * a * uIntensity, 1.0);` + OUT + `}`;
  const VS_PART = `attribute vec3 aColor; attribute float aAlpha; attribute float aSize; attribute float aSeed; uniform float uScale;
  varying vec3 vColor; varying float vAlpha; varying float vSeed;
  void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;

  class Particles {

  function flowArrow(points, color, radius = 0.035, dashes = 4, speed = 0.7) {

  }

  /* ---------- 3D-anchored labels (one set per place) */
  const labelRoot = $("labels"), LBL = [];
  function label(place, o) {
    const el = document.createElement("div"); el.className = "lbl";
    el.innerHTML = `<div class="dot"></div><div class="stem"></div><div class="box"><span class="tx"></span>${o.tag ? tagHTML(o.tag, o.tagText) : ""}</div>`;
    if (o.dx) el.style.setProperty("--dx", o.dx + "px");
    labelRoot.appendChild(el); const it = Object.assign({ place, el, span: el.querySelector(".tx"), last: null }, o); LBL.push(it); return it;
  }
  const projV = new THREE.Vector3();
  function updateLabels() {
    const w = innerWidth, h = innerHeight;
    for (const it of LBL) {
      let vis = it.place === STATE.place && !FLY.active && (!it.cond || it.cond());
      if (vis) {
        projV.copy(typeof it.pos === "function" ? it.pos() : it.pos).project(camera);
        const x = (projV.x * 0.5 + 0.5) * w, y = (-projV.y * 0.5 + 0.5) * h;
        if (projV.z > 1 || x < 20 || x > w - 20 || y < 20 || y > h - 60) vis = false;
        else { it.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; it.el.classList.toggle("down", it.down ?? y < 170); }
        const txt = typeof it.text === "function" ? it.text() : it.text;
        if (txt !== it.last) { it.span.textContent = txt; it.last = txt; }
      }
      it.el.style.opacity = vis ? "1" : "0";
    }
  }

  /* ---------- clickable objects (click without dragging) */
  const CLICK = [], ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $("tip");
  let downAt = null, hoverEv = null, hovered = null;
  const pulseRoot = $("pulses"), PULSES = [], pulseV = new THREE.Vector3();
  function clickable(place, obj, tipText, fn, cond, pulse) {   // pulse: a subtle "click me" ring (false = none, fn = when)
    CLICK.push({ place, obj, tip: tipText, fn, cond });
    if (pulse === false) return;
    const el = document.createElement("div"); el.className = "pulse"; el.innerHTML = "<i></i><i></i>"; el.title = tipText; pulseRoot.appendChild(el);
    obj.updateWorldMatrix(true, true);
    const local = obj.worldToLocal(new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3()));
    PULSES.push({ place, obj, el, local, cond: typeof pulse === "function" ? pulse : cond });
  }
  function updatePulses() {
    const w = innerWidth, h = innerHeight;
    for (const p of PULSES) {
      let vis = p.place === STATE.place && !FLY.active && !UI.clean && !STORY.on && (!p.cond || p.cond());
      if (vis) {
        pulseV.copy(p.local); p.obj.localToWorld(pulseV); pulseV.project(camera);
        const x = (pulseV.x * 0.5 + 0.5) * w, y = (-pulseV.y * 0.5 + 0.5) * h;
        if (pulseV.z > 1 || x < 12 || x > w - 12 || y < 50 || y > h - 60) vis = false;
        else p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
      }
      p.el.style.opacity = vis ? "1" : "0";
    }
  }
  function pick(e) {
    const list = CLICK.filter(c => c.place === STATE.place && (!c.cond || c.cond())); if (!list.length) return null;
    const rc = canvas.getBoundingClientRect();
    ndc.set((e.clientX - rc.left) / rc.width * 2 - 1, -(e.clientY - rc.top) / rc.height * 2 + 1); ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(list.map(c => c.obj), true);
    for (const hgt of hits) { let o = hgt.object; while (o) { const c = list.find(x => x.obj === o); if (c) return c; o = o.parent; } }
    return null;
  }
  canvas.addEventListener("pointerdown", e => { downAt = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("pointerup", e => {
    if (!downAt) return; const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); downAt = null;
    if (moved > 6 || FLY.active) return; const c = pick(e); if (c) c.fn();
  });
  canvas.addEventListener("pointermove", e => { hoverEv = e; });
  canvas.addEventListener("pointerleave", () => { hoverEv = null; hovered = null; tip.style.opacity = 0; canvas.style.cursor = ""; });
  function hoverTick() {
    if (!hoverEv || FLY.active) { if (hovered) { hovered = null; tip.style.opacity = 0; canvas.style.cursor = ""; } return; }
    const e = hoverEv; hoverEv = null; hovered = pick(e);
    canvas.style.cursor = hovered ? "pointer" : "";
    if (hovered) { tip.textContent = hovered.tip; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 12) + "px"; tip.style.opacity = 1; }
    else tip.style.opacity = 0;
  }

  /* ---------- orbit controls + camera flights + shake */
  const controls = OrbitControls ? new OrbitControls(camera, canvas) : null;
  if (controls) { controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false; controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.8; }
  const look = new THREE.Vector3();
  function setLimits(v) {
    if (!controls) return;
    controls.minDistance = v.minD; controls.maxDistance = v.maxD;
    controls.minPolarAngle = v.minPolar ?? 0.05; controls.maxPolarAngle = v.maxPolar ?? Math.PI - 0.05;
    controls.minAzimuthAngle = v.minAz ?? -Infinity; controls.maxAzimuthAngle = v.maxAz ?? Infinity;
  }
  const FLY = { active: false };
  const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function flyTo(p1, t1, dur, o = {}) {
    Object.assign(FLY, { active: true, t: 0, dur, p0: camera.position.clone(), t0: (controls ? controls.target : look).clone(),
      p1: p1.clone(), t1: t1.clone(), arc: o.arc || 0, fadeOut: o.fadeOut || false, fadeIn: o.fadeIn || false, done: o.done || null });
    if (controls) controls.enabled = false;
  }
  function flyTick(dt) {
    if (!FLY.active) return;
    FLY.t += dt; const u = clamp(FLY.t / FLY.dur, 0, 1), e = easeIO(u);
    camera.position.lerpVectors(FLY.p0, FLY.p1, e); camera.position.y += Math.sin(Math.PI * e) * FLY.arc;
    look.lerpVectors(FLY.t0, FLY.t1, e); camera.lookAt(look);
    if (controls) controls.target.copy(look);
    if (FLY.fadeOut) $("fade").style.opacity = sstep(0.5, 1, u).toFixed(3);
    else if (FLY.fadeIn) $("fade").style.opacity = (1 - sstep(0, 0.4, u)).toFixed(3);
    if (u >= 1) {
      FLY.active = false; const done = FLY.done; FLY.done = null;
      if (controls) { controls.target.copy(FLY.t1); controls.enabled = true; controls.update(); }
      if (!FLY.fadeOut) $("fade").style.opacity = "0";
      if (done) done();

}

/* ====================================================================== navigation, actions, narration, loop, boot */
const ACT = {

function headFor(pl) {

  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "pn_" + pl));
  document.querySelectorAll(".acts").forEach(p => p.classList.toggle("on", p.id === "ac_" + pl));

function arriveText(pl, from) {

    case "chamber": return ["This is NASA's FLEX combustion chamber.", "Fuel droplets burned here on the ISS.", "Every change you make runs through our models trained on those runs."];
    case "wiring": return ["Cabin wiring next to the ventilation fan.", "Spark the wires, then try the fan on and off. This station is illustrative.",

}
function go(pl, after) {

  STATE.place = pl; STATE.booted = true;

}
function setGravity(off) {

/* ---------------------------------------------------------------- "Play the story": opt-in guided minute

const STORY = { on: false, token: 0 };
function storyButton() {

}
function stopStory(msg) { if (!STORY.on) return; STORY.on = false; STORY.token++; storyButton(); if (msg) narrate(msg); }

document.addEventListener("pointerdown", e => {   // any click hands control back to the user

}, true);
function hasWebGL() {

}
function applyURL() {

  const fu = URLQ.get("fuel"); if (fu) STATE.q.fuel = /meth/i.test(fu) ? "Methanol" : "Heptane";
  for (const [k, key, lo, hi] of [["o2", "x_o2", 0.1, 0.4], ["p", "p_atm", 0.3, 3.5], ["d0", "d0_mm", 1, 5]]) { const v = parseFloat(URLQ.get(k)); if (isFinite(v)) STATE.q[key] = clamp(v, lo, hi); }
