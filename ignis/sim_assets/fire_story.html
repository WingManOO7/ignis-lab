<!doctype html>

<title>IGNIS LAB fire lab</title>
<!-- IGNIS LAB interactive "fire lab": Earth lab -> orbit -> cabin (FLEX chamber + cabin wiring).
     The FLEX chamber is driven live by window.IGNIS.predict (ignis/sim_assets/ignis_model.js, the trained FLEX
     models evaluated in the browser). Everything else is illustrative.
     Test URL options: ?place=earth|orbit|cabin|chamber|wiring &gravity=off &preset=iss|lunar|exploration
     &fuel=Heptane|Methanol &o2=0.34 &p=1.0 &d0=3 &fan=on|off &spark=1 &suppress=<s> &t=<s> (simulate t s, then hold) &voice=0 -->
<style>
:root{
  --bg:#04060b; --panel:rgba(9,13,22,.8); --line:rgba(140,170,220,.18); --txt:#e7edf6; --mut:#93a0b4;
  --acc:#4fa3ff; --model:#3fd6c5; --runs:#78b8ff; --ill:#c4a8ff; --inp:#a3adbd;
  --green:#3ddc84; --amber:#ffb020; --red:#ff5a5f; --fire:#ff9a3c;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font:13px/1.35 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0b1220 0%,#04060b 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#gl.grey{filter:grayscale(1) brightness(.62)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.5) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#flashOv{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,236,190,.95),rgba(255,140,40,.5) 45%,transparent 75%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.tag{display:inline-block;font:700 8.5px/1 var(--mono);letter-spacing:.04em;padding:2px 5px;cursor:help;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.tag.model{color:var(--model);border-color:rgba(63,214,197,.45);background:rgba(63,214,197,.09)}
.tag.runs{color:var(--runs);border-color:rgba(120,184,255,.45);background:rgba(120,184,255,.09)}
.tag.ill{color:var(--ill);border-color:rgba(196,168,255,.42);background:rgba(196,168,255,.08)}
.tag.inp{color:var(--inp);border-color:rgba(163,173,189,.35);background:rgba(163,173,189,.07)}
.tag.red{color:#ff9a9c;border-color:rgba(255,90,95,.5);background:rgba(255,90,95,.1)}
/* head */
#head{position:absolute;left:14px;top:12px;width:300px;pointer-events:none}
#brand{font:700 10.5px/1 inherit;letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
#brand b{color:#ffb35c;font-weight:700}
#crumbs{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(7,10,18,.72);border:1px solid var(--line);border-radius:22px;padding:4px;backdrop-filter:blur(8px);z-index:3}
#crumbs .sep{color:#4d5a70;font-size:10px}
.crumb{appearance:none;border:1px solid rgba(160,190,240,.2);background:rgba(20,28,44,.7);color:var(--mut);font:650 10.5px/1 inherit;
  padding:5px 8px;border-radius:20px;cursor:pointer;letter-spacing:.04em}
.crumb.cur{color:#04101f;background:var(--acc);border-color:transparent}
.crumb:hover:not(.cur){color:var(--txt);border-color:rgba(160,190,240,.45)}
#ptitle{font:650 17px/1.2 inherit;margin-top:7px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#ptags{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:auto}
/* left station panel */
#side{position:absolute;left:14px;top:86px;width:236px;max-height:calc(100% - 240px);overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px 10px;backdrop-filter:blur(9px)}
.hint{font-size:10.5px;color:var(--mut);margin-top:7px;display:flex;align-items:center;gap:6px}
.hint .bandkey{display:inline-block;width:18px;height:5px;border-radius:3px;background:rgba(63,214,197,.75)}
.status{margin-top:8px;font-size:12px;color:var(--mut)} .status b{font:700 12.5px/1 var(--mono);color:#ffd2a6}
.link{appearance:none;background:none;border:0;color:var(--acc);font:600 11px/1 inherit;cursor:pointer;padding:4px 0 0}
.facts-btn{align-self:flex-end}
.mini .light{padding-bottom:2px} .mini .tag{margin-top:4px}
.ctl .lab b.out{color:#ff8f92}
.card h4{margin:0 0 5px;font:700 10px/1.2 inherit;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px;align-items:center}
.card p{margin:0 0 8px;color:#cdd6e5;font-size:12.5px;line-height:1.4}
.card .tg{margin:3px 0 7px}
.panel{display:none}
.panel.on{display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:1px solid rgba(160,190,240,.24);background:rgba(30,40,62,.7);color:var(--txt);min-height:30px;
  padding:6px 10px;border-radius:8px;font:650 12px/1.2 inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{background:rgba(52,72,112,.85)} .btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.go{background:linear-gradient(180deg,#5aaeff,#3a8cf0);color:#03101f;border-color:transparent}
.btn.go:hover{filter:brightness(1.08)}
.btn.warn{background:rgba(255,154,60,.16);border-color:rgba(255,154,60,.55);color:#ffd2a6}
.btn.cold{background:rgba(160,220,255,.12);border-color:rgba(160,220,255,.5);color:#d4f0ff}
.btn.on{background:rgba(63,214,197,.2);border-color:rgba(63,214,197,.6);color:#bff7ef}
.btn.off{background:rgba(255,90,95,.14);border-color:rgba(255,90,95,.5);color:#ffc2c4}
.btn.sm{min-height:24px;padding:3px 8px;font-size:11px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .btn{flex:1 1 auto}
.col{display:flex;flex-direction:column;gap:6px}
/* sliders */
.ctl{margin:6px 0 1px}
.ctl .lab{display:flex;justify-content:space-between;font-size:11.5px;color:#c9d2e0}
.ctl .lab b{font:700 12px/1 var(--mono);color:#fff}
.ctl .rng-note{font:600 9.5px/1.2 var(--mono);color:var(--model);margin-top:2px;opacity:.9}
.ctl .rng-note.out{color:#ff9a9c}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:3px 0 0;cursor:pointer;--trk:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--trk)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--trk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 3px rgba(79,163,255,.45)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(79,163,255,.45)}
select{width:100%;background:rgba(20,28,44,.9);color:var(--txt);border:1px solid rgba(160,190,240,.25);border-radius:7px;padding:5px 7px;font:600 12px/1.2 inherit}
.seg2{display:flex;gap:4px}
.seg2 .btn{flex:1;min-height:26px;padding:3px 6px;font-size:11.5px}
.seg2 .btn.sel{background:rgba(79,163,255,.28);border-color:rgba(79,163,255,.8)}
.legend{font-size:10.5px;color:var(--mut);margin-top:6px;display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px;background:rgba(63,214,197,.6)}
.warnline{font-size:11.5px;color:#ffcf7a;margin-top:6px}
/* HUD right */
#hud{position:absolute;right:12px;top:12px;width:258px;max-height:calc(100% - 128px);overflow:auto;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
#hud::-webkit-scrollbar{display:none}
#hud.off{display:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0}
.row .k{color:var(--mut);font-size:12px}
.row .v{font:650 12.5px/1.2 var(--mono);text-align:right;white-space:nowrap}
.big{font:750 20px/1.1 var(--mono);color:#fff}
.light{display:flex;align-items:flex-start;gap:8px;padding:2px 0 4px}
.light i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor;margin-top:2px}
.light b{font:800 12px/1.2 var(--mono);letter-spacing:.05em}
.light span{color:#c9d2e0;font-size:11.5px;line-height:1.3}
.light.green{color:var(--green)} .light.amber{color:var(--amber)} .light.red{color:var(--red)}
.reasons{margin:2px 0 4px;padding-left:14px;color:#e6c9cb;font-size:11px}
table.runs{width:100%;border-collapse:collapse;font:600 10.5px/1.3 var(--mono);margin-top:4px}
table.runs td{padding:2px 3px;border-top:1px solid rgba(140,170,220,.1);color:#cfe0ff;white-space:nowrap}
table.runs td.o{color:var(--mut)} table.runs td.o.Extinction{color:#9fd0ff} table.runs td.o.Disruption{color:#ffcf7a} table.runs td.o.Completion{color:#a4f0c8}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:5px}
.live div{background:rgba(120,150,200,.08);border-radius:7px;padding:4px 7px}
.live small{display:block;color:var(--mut);font-size:10px;letter-spacing:.06em}
.live b{font:700 14px/1.15 var(--mono);color:#fff}
#plot{width:100%;height:92px;display:block}
.pfoot{font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.35}
.pfoot b{color:#dfe7f3;font-weight:600}
.facts{margin:0;padding-left:15px;font-size:11.5px;color:#cdd6e5;line-height:1.4}
.facts li{margin:3px 0}
.facts .src{color:var(--mut);font-size:10.5px}
.state{font:700 13px/1.2 var(--mono);color:#ffd2a6}
/* narrator */
#narr{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;width:min(580px,calc(100% - 560px));min-width:320px;display:flex;align-items:center;gap:10px;
  background:rgba(5,8,15,.8);border:1px solid rgba(255,179,92,.25);border-radius:12px;padding:7px 10px;backdrop-filter:blur(9px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
#narr .who{display:none}
#narrText{flex:1;font-size:13.5px;line-height:1.4;min-height:19px;color:#f1f4fa}
#narrStep{color:#ffb35c;font-size:11px}
#narrText .cur{display:inline-block;width:7px;height:14px;background:#ffb35c;margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#narr .nbtns{display:flex;gap:4px}
#narr .btn{min-height:22px;padding:2px 8px;font-size:10.5px}
#footer{position:absolute;left:12px;right:12px;bottom:7px;text-align:center;font-size:10.5px;color:#7f8ba0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 3D labels */
.lbl{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s;will-change:transform;pointer-events:none}
.lbl .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 9px 2px rgba(190,215,255,.8)}
.lbl .stem{position:absolute;left:-.5px;bottom:5px;width:1px;height:24px;background:linear-gradient(to top,rgba(210,225,255,.85),rgba(210,225,255,.15))}
.lbl .box{position:absolute;left:0;bottom:29px;transform:translateX(calc(-50% + var(--dx,0px)));background:rgba(5,8,15,.72);
  border:1px solid rgba(160,190,240,.22);border-radius:7px;padding:3px 7px;font-size:11.5px;line-height:1.3;
  width:max-content;max-width:220px;display:flex;align-items:center;gap:6px}
.lbl .box .tag{font-size:7.5px;padding:1px 4px}
.lbl.down .stem{top:5px;bottom:auto;background:linear-gradient(to bottom,rgba(210,225,255,.85),rgba(210,225,255,.15))}
.lbl.down .box{top:29px;bottom:auto}
#tip{position:absolute;pointer-events:none;background:rgba(255,179,92,.95);color:#1a0d00;font:700 11px/1 inherit;padding:5px 8px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap}
/* overlays */
.notice{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 40px));display:none;pointer-events:none;
  background:rgba(22,6,10,.86);border:1px solid rgba(255,90,95,.6);border-radius:14px;padding:14px 16px;text-align:center;
  backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.notice h3{margin:0 0 6px;font-size:16px;color:#ff8f92}
.notice p{margin:4px 0;color:#e6d6d8;font-size:12.5px;line-height:1.45}
#redNote{top:27%}
#fallback{background:rgba(10,14,24,.92);border-color:rgba(79,163,255,.5);top:24%;pointer-events:auto}
#fallback h3{color:#9ccaff}
#scalebar{position:absolute;right:332px;bottom:178px;text-align:right;font:600 10.5px/1 var(--mono);color:#cfe0ff;display:none}
#scalebar b{display:block;font-weight:700;font-size:9.5px;letter-spacing:.1em;color:rgba(170,200,255,.7);margin-bottom:6px}
#scalebar i{display:block;height:3px;background:#cfe0ff;margin:0 0 4px auto;border-left:1px solid #fff;border-right:1px solid #fff}
@media (max-width:1100px){ #narr{width:calc(100% - 540px);min-width:300px} #narrText{font-size:13px} }
@media (max-width:1060px){ #crumbs{top:auto;bottom:150px} }
@media (max-width:900px){
  #hud{width:250px} #side{width:260px} #head{width:260px}
  #narr{left:14px;right:14px;width:auto;transform:none;min-width:0}
  #scalebar{display:none !important}
}
@media (max-width:680px){ #hud{display:none} #hud.force{display:flex;width:calc(100% - 24px);z-index:5} #side{max-height:calc(100% - 300px)} }
</style>

  <canvas id="gl" tabindex="0"></canvas>

    <div id="brand">IGNIS LAB · <b>Fire lab</b></div>

  <div id="footer">Visuals are illustrative; burn timing and extinction come from models trained on NASA FLEX data. Not affiliated with NASA. · Narration voice: browser text-to-speech</div>
</div>

<script type="module">
/* ====================================================================== params, helpers, model adapter */
const RAW = window.__IGNIS_PARAMS__;
const P = Object.assign({ scenario: "Custom", fuel: "Heptane", p_atm: 1.0, x_o2: 0.21, x_co2: 0, x_he: 0, d0_mm: 3.0 }, RAW || {});
const URLQ = new URLSearchParams(location.search);
const isNum = v => typeof v === "number" && isFinite(v);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const fmt = (v, d = 2) => isNum(v) ? v.toFixed(d) : "—";
const pct = v => isNum(v) ? Math.round(v * 100) + "%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const TAG = { model: "DATA: model trained on NASA FLEX (PSI-69)", runs: "DATA: nearest NASA runs", ill: "ILLUSTRATIVE", inp: "INPUT" };
const CHIP = { model: "DATA", runs: "DATA", ill: "ILLUSTRATIVE", inp: "INPUT" };
const tagHTML = (k, txt) => `<span class="tag ${k}" title="${esc(txt || TAG[k])}">${CHIP[k] || esc(txt || k)}</span>`;

// NASA-sourced facts (short, cited); no other numbers are shown
const FACTS = {
  ug: ["On the ISS, gravity is about one-millionth of Earth's, so there is no buoyancy: hot gas does not rise.", "NASA"],
  candle: ["Candles that burn ≤10 min on Earth lasted up to 45 min on Mir.", "NASA"],
  flex: ["FLEX burned heptane and methanol droplets (~1–5 mm) on the ISS, 2009–2011; K was mostly ~0.25–0.65 mm²/s.", "Nayagam et al., NASA"],
  cool: ["FLEX discovered that heptane droplets can keep burning as an invisible “cool flame” after the visible flame goes out.", "Nayagam et al., Combustion and Flame, 2012"],
  smoke: ["Smoke does not rise to a ceiling detector in microgravity.", "NASA"],
  flow: ["A gentle airflow can feed a fire in microgravity; materials that pass NASA's Earth-gravity flammability test (NASA-STD-6001) can still burn in low gravity.", "Urban et al., ICES 2021"],
  flash: ["In NASA's Saffire tests, fuel vapour that built up led to sudden flash ignitions, and a sample re-ignited after the fan had been off for 70 s.", "NASA Saffire, Urban et al."],
  saffire6: ["In Saffire VI, CO and CO2 exceeded crew limits while temperature rose only near the fire.", "Urban et al., ICES 2024"],
  lunar: ["Higher cabin oxygen, planned for lunar habitats (≥30% O2 at ≤10.2 psi per the challenge brief), makes materials more flammable.", "challenge brief"],
  mir: ["In 1997 an oxygen-generator fire broke out on space station Mir.", "NASA History"],
};
const factLI = k => `<li>${esc(FACTS[k][0])} <span class="src">· ${esc(FACTS[k][1])}</span></li>`;

const HAS_MODEL = !!(window.IGNIS && typeof window.IGNIS.predict === "function" && window.IGNIS_MODEL_DATA);
const lightOf = s => /^GREEN/i.test(s || "") ? "GREEN" : /^AMBER/i.test(s || "") ? "AMBER" : "RED";
const Q0 = { fuel: /meth/i.test(P.fuel) ? "Methanol" : "Heptane", p_atm: +P.p_atm || 1, x_o2: +P.x_o2 || 0.21,
             x_co2: +P.x_co2 || 0, x_he: +P.x_he || 0, d0_mm: +P.d0_mm || 3 };
function sameQ(a, b) { return a.fuel === b.fuel && ["p_atm", "x_o2", "x_co2", "x_he", "d0_mm"].every(k => Math.abs((a[k] || 0) - (b[k] || 0)) < 1e-9); }
function fromParams() {   // the page's starting prediction from Python; used only if the browser model did not load
  const n = (P.nearest_ids || []).map((id, i) => ({ flex_id: id, test_end: (P.nearest_outcomes || [])[i] || "", dext_mm: null, distance: null }));
  return { p_ext: P.p_ext, k: P.k_mm2_s, k_half: P.k_half_mm2_s, burn_time_s: isNum(P.k_mm2_s) ? Q0.d0_mm ** 2 / P.k_mm2_s : null,
           light: lightOf(P.light), light_text: P.light_text || "", reasons: P.reasons || [], nearest: n, d_ext_mm: P.d_ext_mm ?? null,
           n_ext_runs: P.n_ext_runs | 0, cool_flame_possible: !!P.cool_flame_possible, tested_ranges: null };
}
function predict(q) {
  if (HAS_MODEL) {
    try { const r = window.IGNIS.predict(q); if (r) { r.light = lightOf(r.light); return r; } }
    catch (e) { console.warn("IGNIS.predict failed", e); }
  }
  if (RAW && isNum(P.k_mm2_s) && sameQ(q, Q0)) return fromParams();
  return null;
}

/* ---------------------------------------------------------------- d² law burn (DATA: K, P(ext), d_ext) */
const BURN = { t: 0, IGN: 0.7, FADE: 1.3 };
function burnPlan(r, q) {
  const d0 = q.d0_mm, K = r && r.k;
  const ok = !!r && r.light !== "RED" && isNum(K) && K > 0;
  const pExt = r && isNum(r.p_ext) ? r.p_ext : null;
  const dRaw = r && isNum(r.d_ext_mm) && r.d_ext_mm > 0 ? r.d_ext_mm : null;
  let ext = false, note = "";

}

/* ====================================================================== navigation, actions, narration, loop, boot */
const ACT = {

function headFor(pl) {

  $("ptags").innerHTML = PLACES[pl].tags.map(([k, t]) => tagHTML(k, t)).join("");
  document.querySelectorAll(".crumb").forEach(b => b.classList.toggle("cur", b.dataset.go === pl));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "pn_" + pl));

}
function arriveText(pl, from) {

    case "orbit": return from === "earth" ? ["Leaving Earth.", "In orbit, the spacecraft and everything inside it are in free fall.", "Gravity feels about one-millionth of Earth's, so hot gas no longer rises.", "Click the spacecraft to go inside."]
      : ["Back outside. Click the spacecraft to go in again."];

    case "chamber": return ["This is NASA's FLEX combustion chamber.", "Fuel droplets burned here on the ISS.", "Every change you make runs through our models trained on those runs."];
    case "wiring": return ["Cabin wiring next to the ventilation fan.", "Spark the wires, then try the fan on and off. This station is illustrative.",

function go(pl, after) {

  STATE.place = pl; STATE.booted = true;
  headFor(pl); renderControls(); renderHUD();
  if (pl === "chamber") narrateModel(arriveText(pl, from)); else if (pl !== from) narrate(arriveText(pl, from));
  if (WORLD) WORLD.go(pl, after); else if (after) after();

}
function setGravity(off) {
