<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGNIS LAB fire story</title>
<!-- IGNIS LAB "fire story": a 5-scene 3D cinematic. Scene 4 (droplet burn) is driven by params injected by
     ignis/simulation.py (models trained on NASA FLEX, PSI-69). Everything else is illustrative.
     URL options for testing: ?scene=1..5  &t=<seconds into the scene, pauses there>  &fan=off  &play=1 -->
<style>
:root{
  --bg:#04060b; --panel:rgba(9,13,22,.74); --line:rgba(140,170,220,.18); --txt:#e7edf6; --mut:#93a0b4;
  --acc:#4fa3ff; --model:#3fd6c5; --runs:#78b8ff; --ill:#c4a8ff; --inp:#a3adbd;
  --green:#3ddc84; --amber:#ffb020; --red:#ff5a5f;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font:13px/1.35 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0b1220 0%,#04060b 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.tag{display:inline-block;font:700 9.5px/1 var(--mono);letter-spacing:.03em;padding:3px 6px;border-radius:4px;
  border:1px solid;white-space:nowrap;vertical-align:middle}
.tag.model{color:var(--model);border-color:rgba(63,214,197,.45);background:rgba(63,214,197,.09)}
.tag.runs{color:var(--runs);border-color:rgba(120,184,255,.45);background:rgba(120,184,255,.09)}
.tag.ill{color:var(--ill);border-color:rgba(196,168,255,.42);background:rgba(196,168,255,.08)}
.tag.inp{color:var(--inp);border-color:rgba(163,173,189,.35);background:rgba(163,173,189,.07)}
/* scene head */
#head{position:absolute;left:16px;top:14px;width:min(470px,calc(100% - 350px));pointer-events:none}
#brand{font:700 10.5px/1 inherit;letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
#brand b{color:#ffb35c;font-weight:700}
#stitle{font:650 20px/1.2 inherit;margin-top:7px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#stitle small{display:block;font:600 10.5px/1 inherit;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
#stags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
#fact{margin-top:10px;font-size:12px;line-height:1.45;color:#cdd6e5;background:rgba(6,9,16,.62);border-left:2px solid var(--acc);
  padding:7px 11px;border-radius:0 8px 8px 0;backdrop-filter:blur(6px)}
#fact:empty{display:none}
#fact .src{color:var(--mut);font-size:11px}
/* HUD */
#hud{position:absolute;right:12px;top:12px;width:300px;max-height:calc(100% - 92px);overflow:auto;display:flex;
  flex-direction:column;gap:7px;scrollbar-width:none}
#hud::-webkit-scrollbar{display:none}
#hud.off{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px 10px;backdrop-filter:blur(9px)}
.card h4{margin:0;font:700 10px/1 inherit;letter-spacing:.15em;color:var(--mut);text-transform:uppercase}
.card .tg{margin:5px 0 6px}
.scen{font-weight:650;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips span{font:600 11px/1 var(--mono);padding:4px 6px;border-radius:5px;background:rgba(120,150,200,.12);color:#dfe7f3}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0}
.row .k{color:var(--mut);font-size:12px}
.row .v{font:650 12.5px/1.2 var(--mono);text-align:right;white-space:nowrap}
.light{display:flex;align-items:center;gap:8px;padding:2px 0 4px}
.light i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor}
.light b{font:800 12px/1 var(--mono);letter-spacing:.05em}
.light span{color:#c9d2e0;font-size:11.5px;line-height:1.3}
.light.green{color:var(--green)} .light.amber{color:var(--amber)} .light.red{color:var(--red)}
.ids{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.ids span{font:600 10px/1 var(--mono);padding:3px 5px;border-radius:4px;background:rgba(120,184,255,.1);color:#b9d6ff}
.ids span em{font-style:normal;color:var(--mut)}
#liveBox{position:absolute;left:16px;bottom:150px;width:292px;display:none}
#liveBox .card{background:rgba(9,13,22,.8)}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.live div{background:rgba(120,150,200,.08);border-radius:7px;padding:5px 7px}
.live small{display:block;color:var(--mut);font-size:10px;letter-spacing:.06em}
.live b{font:700 14px/1.15 var(--mono);color:#fff}
#plot{width:100%;height:132px;display:block}
.pfoot{font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.35}
.pfoot b{color:#dfe7f3;font-weight:600}
/* caption */
#caption{position:absolute;left:16px;right:328px;bottom:84px;display:flex;justify-content:center;pointer-events:none}
#caption .in{max-width:660px;background:rgba(5,8,15,.74);border:1px solid var(--line);border-radius:12px;padding:10px 16px;
  font-size:14.5px;line-height:1.45;text-align:center;backdrop-filter:blur(8px);transition:opacity .35s;text-wrap:balance}
#caption .in:empty{opacity:0}
/* 3D labels */
.lbl{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s;will-change:transform}
.lbl .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 9px 2px rgba(190,215,255,.8)}
.lbl .stem{position:absolute;left:-.5px;bottom:5px;width:1px;height:26px;background:linear-gradient(to top,rgba(210,225,255,.85),rgba(210,225,255,.15))}
.lbl .box{position:absolute;left:0;bottom:31px;transform:translateX(calc(-50% + var(--dx,0px)));background:rgba(5,8,15,.8);
  border:1px solid rgba(160,190,240,.26);border-radius:8px;padding:5px 8px 6px;font-size:11.5px;line-height:1.3;
  width:max-content;max-width:270px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lbl .box .tag{font-size:8.5px;padding:2px 5px}
.lbl.down .stem{top:5px;bottom:auto;background:linear-gradient(to bottom,rgba(210,225,255,.85),rgba(210,225,255,.15))}
.lbl.down .box{top:31px;bottom:auto}
/* scene-4 instrument frame */
#reticle{position:absolute;inset:0;pointer-events:none;display:none}
#scalebar{position:absolute;right:345px;bottom:152px;text-align:right;font:600 10.5px/1 var(--mono);color:#cfe0ff}
#scalebar b{display:block;font-weight:700;font-size:9.5px;letter-spacing:.1em;color:rgba(170,200,255,.7);margin-bottom:6px}
#scalebar i{display:block;height:3px;background:#cfe0ff;margin-bottom:4px;border-left:1px solid #fff;border-right:1px solid #fff}
/* notices */
.notice{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(470px,calc(100% - 40px));display:none;
  background:rgba(22,6,10,.86);border:1px solid rgba(255,90,95,.55);border-radius:14px;padding:16px 18px;text-align:center;
  backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.notice h3{margin:0 0 6px;font-size:16px;color:#ff8f92}
.notice p{margin:4px 0;color:#e6d6d8;font-size:12.5px;line-height:1.45}
.notice ul{margin:6px 0 0;padding:0;list-style:none;color:#c9b4b6;font-size:11.5px}
#fallback{background:rgba(10,14,24,.9);border-color:rgba(79,163,255,.5)}
#notice{left:calc(50% + 110px);top:27%;width:min(400px,calc(100% - 40px))}
@media (max-width:860px){#notice{left:50%;top:24%}}
#fallback h3{color:#9ccaff}
/* controls */
#controls{position:absolute;left:12px;right:12px;bottom:25px;height:48px;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:rgba(7,10,18,.82);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(9px)}
.btn{appearance:none;border:1px solid rgba(160,190,240,.22);background:rgba(30,40,62,.6);color:var(--txt);height:30px;min-width:30px;
  padding:0 9px;border-radius:8px;font:650 12px/1 inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.btn:hover{background:rgba(52,72,112,.75)} .btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn.main{background:var(--acc);color:#03101f;border-color:transparent;min-width:38px}
.btn.on{background:rgba(63,214,197,.2);border-color:rgba(63,214,197,.6);color:#bff7ef}
.btn.offst{background:rgba(255,90,95,.14);border-color:rgba(255,90,95,.5);color:#ffc2c4}
.grp{display:flex;gap:4px;align-items:center;flex:none}
.grp .lab{font-size:10.5px;color:var(--mut);margin-right:2px;letter-spacing:.06em;text-transform:uppercase}
.spd{min-width:36px;padding:0 6px}
.spd.sel{background:rgba(79,163,255,.25);border-color:rgba(79,163,255,.7)}
#segs{flex:1;display:flex;gap:6px;min-width:0}
.seg{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px 0;background:none;border:0;color:inherit;font:inherit;text-align:left}
.seg .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.seg .fill{height:100%;width:0;background:linear-gradient(90deg,#4fa3ff,#7cc3ff)}
.seg.s4 .fill{background:linear-gradient(90deg,#3fd6c5,#8ff0e4)}
.seg .nm{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.cur .nm{color:var(--txt);font-weight:600}
#fanGrp{display:none}
#footer{position:absolute;left:12px;right:12px;bottom:6px;text-align:center;font-size:10.5px;color:#7f8ba0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){
  #hud{width:250px} #caption{right:270px} #head{width:calc(100% - 290px)}
  .seg .nm{font-size:10px}
}
@media (max-width:680px){
  #hud{display:none} #hud.force{display:flex;width:calc(100% - 24px);max-height:calc(100% - 100px)}
  #caption{right:16px} #head{width:calc(100% - 32px)} #stitle{font-size:16px}
  .seg .nm .long{display:none} .grp .lab{display:none}
}
</style>

<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div id="reticle"><div id="scalebar"><b>CHAMBER VIEW · NO BUOYANCY</b><i></i><span>1 mm</span></div></div>
  <div id="fade"></div>
  <div id="head">
    <div id="brand">IGNIS LAB · <b>Fire story</b></div>
    <div id="stitle"></div>
    <div id="stags"></div>
    <div id="fact"></div>
  </div>
  <div id="hud"></div>
  <div id="liveBox"></div>
  <div id="caption"><div class="in" id="capText"></div></div>
  <div class="notice" id="notice"></div>
  <div class="notice" id="fallback"></div>
  <div id="controls">
    <div class="grp">
      <button class="btn" id="bPrev" title="Previous scene (←)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn main" id="bPlay" title="Play / pause (space)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5v14l12-7z"/></svg></button>
      <button class="btn" id="bNext" title="Next scene (→)"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div id="segs"></div>
    <div class="grp" id="fanGrp"><span class="lab">Fan</span><button class="btn on" id="bFan" title="Ventilation fan ON / OFF">ON</button></div>
    <div class="grp"><span class="lab">Speed</span>
      <button class="btn spd" data-s="0.5">0.5×</button><button class="btn spd sel" data-s="1">1×</button><button class="btn spd" data-s="2">2×</button>
    </div>
    <button class="btn" id="bHud" title="Show / hide the data panel">Data</button>
  </div>
  <div id="footer">Shapes, colours and the cabin are illustrative. Burn timing and extinction come from models trained on NASA FLEX data. Not affiliated with NASA.</div>
</div>
<script>window.__IGNIS_PARAMS__ = /*__IGNIS_PARAMS__*/null;</script>
<script type="module">
/* ============================================================== params + burn model (no WebGL needed) */
const RAW = window.__IGNIS_PARAMS__;
const DEMO = { scenario: "ISS cabin (14.7 psia, 21% O2) [demo values]", fuel: "Heptane", p_atm: 1.0, x_o2: 0.21, x_co2: 0, x_he: 0,
  diluent: "none (N2 only)", diluent_frac: 0, d0_mm: 3.0, k_mm2_s: 0.535, k_half_mm2_s: 0.082, p_ext: 0.653,
  light: "GREEN", light_text: "GREEN - close to real NASA runs", reasons: [], validated: true, d_ext_mm: 2.33, n_ext_runs: 1,
  cool_flame_possible: true, nearest_ids: ["N01H201", "30CAL06", "N01H301", "N01H202", "C01H601"],
  nearest_outcomes: ["Disruption", "Disruption", "Completion", "Completion", "Extinction"] };
const P = Object.assign({}, DEMO, RAW || {});
const Q = new URLSearchParams(location.search);
const isNum = v => typeof v === "number" && isFinite(v);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const fmt = (v, d = 2) => isNum(v) ? v.toFixed(d) : "—";
const pct = v => isNum(v) ? (v * 100).toFixed(v * 100 % 1 ? 1 : 0) + "%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const TAG = { model: "DATA: model trained on NASA FLEX (PSI-69)", runs: "DATA: nearest NASA runs", ill: "ILLUSTRATIVE", inp: "INPUT" };
const tagHTML = (k, txt) => `<span class="tag ${k}">${esc(txt || TAG[k])}</span>`;
const LIGHT = /^GREEN/i.test(P.light) ? "GREEN" : /^AMBER/i.test(P.light) ? "AMBER" : "RED";

const B = (() => {
  const d0 = isNum(P.d0_mm) && P.d0_mm > 0 ? P.d0_mm : 3;
  const K = P.k_mm2_s, half = isNum(P.k_half_mm2_s) ? P.k_half_mm2_s : null;
  const ok = P.validated === true && LIGHT !== "RED" && isNum(K) && K > 0;
  const pExt = isNum(P.p_ext) ? P.p_ext : null;
  const dRaw = isNum(P.d_ext_mm) && P.d_ext_mm > 0 ? P.d_ext_mm : null;
  let ext = false, note = "";
  if (ok && pExt !== null && pExt >= 0.5) {
    if (dRaw === null) note = "The model expects the visible flame to go out early, but no nearby NASA run recorded an extinction diameter, so the burn is shown to completion.";
    else if (dRaw >= d0 * 0.97) note = `The nearest NASA runs went out at d ≈ ${dRaw.toFixed(2)} mm, which is not smaller than this droplet, so that value cannot be applied; the burn is shown to completion.`;
    else ext = true;
  }
  const dExt = ext ? dRaw : null;
  const tBurnout = ok ? d0 * d0 / K : null;
  const tExt = ext ? (d0 * d0 - dExt * dExt) / K : null;
  const Tvis = ok ? (ext ? tExt : tBurnout) : 0;          // real seconds of visible burning
  const S = ok ? clamp(Tvis, 10, 20) : 0;                  // screen seconds at 1x
  const rate = ok ? Tvis / S : 1;                          // real seconds per screen second
  const INTRO = 3.4, FADE = 1.4;
  const cool = ext && P.cool_flame_possible === true;
  const TAIL = !ok ? 0 : ext ? (cool ? 8.5 : 4.5) : 4;
  const dur = ok ? INTRO + S + TAIL : 11;
  function at(st) {
    const raw = Math.max(0, (st - INTRO) * rate);
    const tr = ok ? Math.min(raw, Tvis) : 0;
    const d = ok ? Math.sqrt(Math.max(d0 * d0 - K * tr, 0)) : d0;
    const after = ok ? Math.max(0, st - INTRO - S) : 0;
    let phase = st < 2.3 ? "deploy" : !ok ? "idle" : st < INTRO ? "ignite" : raw < Tvis ? "burn" : "after";
    let dVis = d;   // drawn droplet: keeps evaporating after the visible flame goes out (illustrative rate)
    if (ext && after > 0) dVis = Math.sqrt(Math.max(dExt * dExt - 0.3 * K * after * rate, 0.04 * d0 * d0));
    let flame = 0;
    if (ok) {
      if (phase === "ignite") flame = sstep(INTRO - 0.7, INTRO, st);
      else if (phase === "burn") flame = 1;
      else if (phase === "after") flame = ext ? 1 - sstep(0, FADE, after) : 0;
      if (!ext && phase === "burn") flame *= sstep(0, 0.12, d / d0);
    }
    const coolA = cool ? sstep(FADE * 0.7, FADE + 1.8, after) : 0;
    return { tr, d, d2: d * d, dVis, phase, flame, coolA, after, prog: ok && Tvis ? tr / Tvis : 0 };
  }
  return { ok, d0, K, half, pExt, ext, dExt, tBurnout, tExt, Tvis, S, rate, INTRO, FADE, dur, cool, note, at };
})();

const O2 = isNum(P.x_o2) ? P.x_o2 : 0.21;
const O2F = clamp(1 + (O2 - 0.21) * 2.6, 0.75, 1.45);       // qualitative size/brightness factor for scene 5 only

/* ============================================================== scenes: text */
const SC = [
  { name: "Earth lab", long: "Earth lab", dur: 13, title: "A flame in normal gravity",
    fact: `Normal gravity (1 g): buoyancy shapes the flame.`,
    caps: [[0, 4.6, "On Earth, a flame heats the air around it. Hot gas is lighter than the cool air around it, so it rises: buoyancy."],
           [4.6, 9.2, "The rising gas pulls fresh air in from below and stretches the flame into a teardrop that glows yellow from hot soot."],
           [9.2, 99, "Smoke and hot gas stream upward, away from the flame. Now take gravity away…"]] },
  { name: "Into orbit", long: "Into orbit", dur: 13, title: "Into orbit",
    fact: `On the ISS, gravity is about one-millionth of Earth's.<span class="src"> · NASA</span>`,
    caps: [[0, 5, "A spacecraft in orbit is in free fall. Inside, things feel about one-millionth of Earth's gravity."],
           [5, 9.5, "With no buoyancy, hot gas does not rise, so fire behaves very differently."],
           [9.5, 99, "Let's go inside the module."]] },
  { name: "Inside the cabin", long: "Cabin", dur: 11, title: "Inside the cabin",
    fact: `Smoke does not rise to a ceiling detector in microgravity.`,
    caps: [[0, 4, "Inside there is no up or down. Fans keep the cabin air moving; nothing else stirs it."],
           [4, 7.8, "There is no buoyancy, so smoke does not rise to a ceiling detector."],
           [7.8, 99, "In a sealed combustion chamber, NASA's FLEX experiment burned fuel droplets. Let's look inside."]] },
  { name: "Droplet flame in microgravity", long: "Droplet flame", dur: B.dur, title: "Droplet flame in microgravity",
    fact: `FLEX burned heptane and methanol droplets (~1–5 mm) on the ISS, 2009–2011; K was mostly ~0.25–0.65 mm²/s.<span class="src"> · Nayagam et al., NASA</span><br>Candles that burn ≤10 min on Earth lasted up to 45 min on Mir.<span class="src"> · NASA</span>` },
  { name: "Spark in the cabin", long: "Spark in the cabin", dur: 22, title: "Spark in the cabin",
    fact: "" },
];

function cap4(t) {
  const bs = B.at(t), F = esc(P.fuel).toLowerCase();
  if (t < 2.3) return `A ${F} droplet (d₀ = ${fmt(B.d0)} mm) is held between two needles, which pull away and leave it floating.`;
  if (!B.ok) return "These conditions are outside NASA's tested range, so no burn is simulated here.";
  if (bs.phase === "ignite") return "Hot-wire igniters light it.";
  if (bs.phase === "burn") {
    if (bs.prog < 0.45) return "No buoyancy: the flame becomes a sphere, dimmer and bluer, fed only by slow diffusion of fuel vapour out and oxygen in.";
    if (B.note && bs.prog > 0.75) return B.note;
    return `d² law: the droplet's diameter squared shrinks at a constant rate, K = ${fmt(B.K)} mm²/s (model trained on NASA FLEX).`;
  }
  if (B.ext) {
    if (B.cool && bs.after > B.FADE + 1.6) return "FLEX discovered that heptane droplets can keep burning as an invisible “cool flame” after the visible flame goes out (Nayagam et al., 2012).";
    return `The visible flame goes out at d ≈ ${fmt(B.dExt)} mm: the median extinction diameter of the nearest NASA runs. The droplet keeps evaporating.`;
  }
  return `The droplet is used up after d₀²/K = ${fmt(B.tBurnout, 1)} s of burning.`;
}
function cap5(t, fanOn) {
  if (t < 3.6) return "Back in the cabin, a damaged wire arcs against a panel.";
  if (t < 8.5) return fanOn ? "The spark lights a nearby material. With the ventilation fan ON, the airflow feeds the flame: it stretches downstream and grows."
                            : "The spark lights a nearby material. With the fan OFF, the flame stays small and nearly spherical, starved of oxygen.";
  if (t < 13) return "Materials that pass NASA's Earth-gravity flammability test (NASA-STD-6001) can still burn in low gravity, where a gentle flow can feed a fire (Urban et al., ICES 2021).";
  if (t < 17.5) return "The smoke spreads as a cloud in every direction. It does not rise to the ceiling detector.";
  return "In NASA's Saffire VI tests, toxic CO and CO2 exceeded crew limits while temperature rose only near the fire, and a typical smoke-alarm threshold was reached late (Urban et al., ICES 2024).";
}
function fact5() {

  if (O2 < 0.205) return `Oxygen matters. O₂ = ${o}, below normal air: the flame is drawn smaller and dimmer <span class="src">(qualitative only)</span>.`;
  return `Oxygen matters: in air richer than 21% O₂ the flame would be drawn larger and brighter <span class="src">(qualitative only)</span>. Here O₂ = ${o}.`;
}

function drawPlot(bs) {
  const cv = $("plot"); if (!cv) return;

  if (!W || !H) return;

  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  g.font = "10px " + getComputedStyle(document.body).getPropertyValue("--mono");

  }

  g.strokeStyle = "rgba(190,205,235,.55)"; g.beginPath(); g.moveTo(L, T); g.lineTo(L, T + ph); g.lineTo(L + pw, T + ph); g.stroke();
  // K +/- half-width band

    const lo = Math.max(B.K - B.half, 1e-3), hi = B.K + B.half;
    g.lineTo(X(Tm), Y(Math.max(d02 - lo * Tm, 0))); g.lineTo(X(Math.min(Tm, d02 / hi)), Y(Math.max(d02 - hi * Math.min(Tm, d02 / hi), 0)));

    g.fillStyle = "rgba(160,200,255,.95)"; g.textAlign = "right"; g.fillText(`d_ext² (NASA runs)`, L + pw, ye - 4);
  }

  g.strokeStyle = "#ffffff"; g.lineWidth = 2.2; g.beginPath(); g.moveTo(X(0), Y(d02)); g.lineTo(X(bs.tr), Y(bs.d2)); g.stroke();
  g.fillStyle = bs.flame > 0.05 ? "#8fd0ff" : "#ffffff"; g.beginPath(); g.arc(X(bs.tr), Y(bs.d2), 3.5, 0, 7); g.fill();
  if (B.ext && bs.phase === "after") { g.strokeStyle = "#ff8f92"; g.lineWidth = 2; const x = X(B.tExt), y = Y(B.dExt * B.dExt);
    g.beginPath(); g.moveTo(x - 5, y - 5); g.lineTo(x + 5, y + 5); g.moveTo(x + 5, y - 5); g.lineTo(x - 5, y + 5); g.stroke(); }
  // axes text
  g.fillStyle = "rgba(200,212,232,.85)"; g.textAlign = "right"; g.fillText(fmt(d02, 1), L - 4, Y(d02) + 3); g.fillText("0", L - 4, T + ph + 3);
  g.textAlign = "left"; g.fillText("d² (mm²)", L + 4, T + 9);
  g.textAlign = "center"; g.fillText("0", L, H - 6); g.fillText(fmt(Tm, 1) + " s", L + pw - 12, H - 6);
  g.fillText("time t (real s)", L + pw / 2, H - 6);
  g.fillStyle = "rgba(143,240,228,.95)"; g.textAlign = "right"; g.fillText(`slope = −K = −${fmt(B.K)} mm²/s`, L + pw, T + 10);
}

function updateLive(t, speed) {
  const bs = B.at(t);
  if (!B.ok) { $("lt").textContent = "—"; $("ld").textContent = fmt(B.d0) + " mm"; $("ld2").textContent = "—";
    $("lpb").innerHTML = "Outside NASA's tested conditions: <b>not simulated</b>."; drawPlot(bs); return bs; }
  $("lt").textContent = bs.tr.toFixed(1) + " s";
  $("ld").textContent = bs.d.toFixed(2) + " mm";
  $("ld2").textContent = bs.d2.toFixed(2);
  const x = B.rate * speed;
  let s = `Playback <b>${x.toFixed(x < 1 ? 2 : 1)}×</b> real time. `;
  if (B.ext) s += bs.phase === "after" ? `<b>Visible flame out</b> at t = ${fmt(B.tExt, 1)} s, d = ${fmt(B.dExt)} mm (nearest NASA runs). After that: not modelled.`
                                        : `Flame expected to go out at d = ${fmt(B.dExt)} mm (P = ${Math.round(B.pExt * 100)}%).`;

/* ============================================================== story controller */
const S = { idx: 0, t: 0, playing: true, speed: 1, fan: Q.get("fan") !== "off", flow: Q.get("fan") === "off" ? 0 : 1, ended: false, trans: null };

function enterScene(i, t = 0) {

      <ul>${(P.reasons || []).slice(0, 3).map(r => `<li>· ${esc(r)}</li>`).join("")}</ul><p style="margin-top:8px">Try the ISS cabin preset to see a real-data burn.</p>`;
    nt.style.display = "block";
  } else nt.style.display = "none";

function goto(i) {
  i = clamp(i, 0, 4);
  if (S.ended) { S.ended = false; S.playing = true; setPlayIcon(); }
  if (!WORLD) { enterScene(i); return; }
  S.trans = { phase: "out", a: S.trans ? S.trans.a : 0, to: i };
}
function setPlayIcon() {
  $("playIcon").innerHTML = S.ended ? '<path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>'
    : S.playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 5v14l12-7z"/>';
}
$("bPlay").onclick = () => {

  else S.playing = !S.playing;
  setPlayIcon();
};
$("bPrev").onclick = () => goto(S.t > 2.5 ? S.idx : S.idx - 1);
$("bNext").onclick = () => goto(S.idx + 1);
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  S.speed = parseFloat(b.dataset.s); document.querySelectorAll(".spd").forEach(x => x.classList.toggle("sel", x === b));
});
function setFan(on) { S.fan = on; const b = $("bFan"); b.textContent = on ? "ON" : "OFF"; b.classList.toggle("on", on); b.classList.toggle("offst", !on); }
$("bFan").onclick = () => setFan(!S.fan);
$("bHud").onclick = () => { const h = $("hud"); if (innerWidth <= 680) h.classList.toggle("force"); else h.classList.toggle("off"); };
addEventListener("keydown", e => {

  else if (e.code === "ArrowRight") goto(S.idx + 1);

});

function fallback(msg) {
  const f = $("fallback");
  f.innerHTML = `<h3>3D view unavailable</h3><p>${esc(msg)}</p><p>The story captions, the data panel and the live d² burn plot (scene 4) still work.</p>`;
  f.style.display = "block";
}

function startLoop() {
  buildHUD(); setFan(S.fan);
  let start = 0, qt = parseFloat(Q.get("t"));
  const qs = parseInt(Q.get("scene"), 10);
  if (qs >= 1 && qs <= 5) start = qs - 1;
  else if (isNum(P.start_scene) && P.start_scene >= 1 && P.start_scene <= 5) start = (P.start_scene | 0) - 1;
  else { try { const s = JSON.parse(sessionStorage.getItem("ignis_sim_scene") || "null"); if (s && Date.now() - s.ts < 180000) start = clamp(s.i | 0, 0, 4); } catch (e) {} }
  if (isNum(qt)) { S.playing = Q.get("play") === "1"; } else qt = 0;
  enterScene(start, clamp(qt, 0, SC[start].dur));
  setPlayIcon();
  let last = performance.now(), et = 0;
  const fadeEl = $("fade"), capEl = $("capText");
  let lastCap = "";
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; et += dt;
    if (S.playing && !S.ended) S.t += dt * S.speed;
    const dur = SC[S.idx].dur;
    if (S.t >= dur && !S.trans) {
      if (S.idx < 4) { if (S.playing) goto(S.idx + 1); else S.t = dur; }
      else { S.t = dur; if (S.playing) { S.ended = true; S.playing = false; setPlayIcon(); } }
    }
    if (S.trans) {
      const tr = S.trans;
      if (tr.phase === "out") { tr.a += dt / 0.45; if (tr.a >= 1) { tr.a = 1; enterScene(tr.to); tr.phase = "in"; } }
      else { tr.a -= dt / 0.75; if (tr.a <= 0) S.trans = null; }
    }
    fadeEl.style.opacity = S.trans ? S.trans.a.toFixed(3) : "0";
    S.flow += ((S.fan ? 1 : 0) - S.flow) * (1 - Math.exp(-dt * 1.6));
    const tt = Math.min(S.t, dur);
    const c = caption(S.idx, tt, S.fan);
    if (c !== lastCap) { capEl.innerHTML = esc(c); lastCap = c; }
    segEls.forEach((el, k) => { el.firstChild.firstChild.style.width = (k < S.idx ? 100 : k > S.idx ? 0 : 100 * tt / dur).toFixed(1) + "%"; });
    if (S.idx === 3) updateLive(tt, S.speed);
    if (WORLD) WORLD.update(S.idx, tt, dt, et);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function hasWebGL() {
  try { const c = document.createElement("canvas"); return !!(window.WebGLRenderingContext && (c.getContext("webgl2") || c.getContext("webgl"))); }
  catch (e) { return false; }
}

async function boot() {
  if (!hasWebGL()) { fallback("WebGL is disabled or not supported in this browser."); return startLoop(); }
  let THREE, PP = null;
  try { THREE = await import("three"); }
  catch (e) { fallback("Could not load the 3D engine (three.js) from cdn.jsdelivr.net. Check the internet connection."); return startLoop(); }
  try {
    const m = await Promise.all(["EffectComposer", "RenderPass", "UnrealBloomPass", "OutputPass"].map(n => import(`three/addons/postprocessing/${n}.js`)));
    PP = Object.assign({}, ...m);
  } catch (e) { PP = null; }
  try { WORLD = createWorld(THREE, PP); }
  catch (e) { console.error(e); WORLD = null; fallback("The 3D scene failed to start (" + (e && e.message) + ")."); }
  startLoop();
}

      const fc = tmpV.copy(padC).add(V3(-0.06, 0, 0)).addScaledVector(flowAxis, L * 0.42 * f);

  /* ================================================== scene 4: droplet in the combustion chamber (units: mm) */
  function sceneDroplet() {
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020306);

    const needles = [-1, 1].map(sx => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 60, 12), needleMat); m.rotation.z = Math.PI / 2; m.userData.sx = sx; scene.add(m); return m; });

    const igs = igDirs.map(d => { const g = new THREE.Group(); const w = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 40, 8), new THREE.MeshStandardMaterial({ color: 0x80705e, metalness: 0.7, roughness: 0.4 }));
      w.position.y = 20.4; g.add(w); const tip = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), new THREE.MeshStandardMaterial({ color: 0x5a4030, emissive: new THREE.Color(2.5, 0.8, 0.15), emissiveIntensity: 0 }));
      g.add(tip); g.quaternion.setFromUnitVectors(UP, d); g.userData = { d, tip }; scene.add(g); return g; });

    const soot = sphereFlame([1.0, 0.6, 0.12], [0.35, 0.12, 0.02], { pow: 3.0, noise: 0.7 }); scene.add(soot);

    const lp = new THREE.Vector3(), lp2 = new THREE.Vector3(), lp3 = new THREE.Vector3(), lp4 = new THREE.Vector3();
    label(3, { pos: () => lp.set(-rNow * 0.6, -rNow * 0.6, 0), text: () => B.ok ? `fuel droplet · d = ${B.at(S.t).d.toFixed(2)} mm` : `fuel droplet · d₀ = ${fmt(B.d0)} mm (not ignited)`, tag: B.ok ? "model" : "inp", t0: 0.6, dx: -150, down: true });

    label(3, { pos: () => lp3.set(RfNow * 0.95, -RfNow * 0.3, 0), text: "fuel vapour diffuses out · oxygen diffuses in", tag: "ill", t0: B.INTRO + B.S * 0.62, t1: B.INTRO + B.S, cond: () => B.ok, down: false, dx: 60 });
    label(3, { pos: () => lp4.set(rNow * 0.6, -rNow * 0.6, 0), dx: 150, text: `visible flame out at d ≈ ${fmt(B.dExt)} mm (nearest NASA runs)`, tag: "runs", t0: B.INTRO + B.S + 0.3, t1: B.INTRO + B.S + (B.cool ? 3.4 : 99), cond: () => B.ext, down: true });
    label(3, { pos: () => lp2.set(rNow * 2.2, rNow * 2.2, 0), text: "cool flame (invisible to the eye; detected by NASA radiometers — FLEX discovery, Nayagam et al. 2012)", tag: "ill", t0: B.INTRO + B.S + B.FADE + 1.4, cond: () => B.cool, dx: 80, down: false });
    const D = Math.max(B.dur, 3.6);
    const path = camPath([{ t: 0, p: [0, 9 * sc, 82 * sc], l: [0, 0, 0] }, { t: 3.4, p: [6 * sc, 4 * sc, 50 * sc], l: [0, 0, 0] }, { t: D, p: [-7 * sc, 3 * sc, 44 * sc], l: [0, 0.3 * sc, 0] }]);
    const sb = $("scalebar"), sbI = sb.querySelector("i"), sbS = sb.querySelector("span"), pA = new THREE.Vector3(), pB = new THREE.Vector3();
    return {
      scene, fov: 34, near: 0.1, far: 1500, exposure: 1.1, bloom: [0.75, 0.42, 0.5],
      enter(t) { o2p.clear(); fup.clear(); const bs = B.at(t); if (bs.phase === "burn") for (let k = 0; k < 80; k++) { RfNow = r0 * 4; diffusion(0.05, 1); } },
      update(t, dt, et) {
        const bs = B.at(t);
        path(t, camera);
        rNow = Math.max(bs.dVis / 2, 0.03);
        drop.scale.setScalar(rNow); dropRim.scale.setScalar(rNow * 1.002);
        // needles retract at ~1.3-2.2 s
        const nOut = sstep(1.2, 2.2, t);
        needles.forEach(n => { n.position.x = n.userData.sx * (r0 + 30 + nOut * 34); });
        // igniters: approach, glow, retract
        const ig = B.ok ? sstep(1.7, 2.6, t) * (1 - sstep(3.5, 4.6, t)) : sstep(1.7, 2.6, t) * (1 - sstep(4.6, 5.6, t));
        const hot = B.ok ? sstep(2.4, 2.8, t) * (1 - sstep(3.3, 3.9, t)) : 0;
        igs.forEach(g => { g.position.copy(g.userData.d).multiplyScalar(r0 + 0.7 + (1 - ig) * 26); g.userData.tip.material.emissiveIntensity = hot * 1.6; });
        ignGlow.position.copy(igs[0].position); ignGlow.quaternion.copy(camera.quaternion); ignGlow.scale.setScalar(1.6 * sc); ignGlow.material.uniforms.uIntensity.value = hot * 1.2;
        // flame (shape and colour illustrative; timing from the model)
        const p = bs.prog;
        let Rf = r0 * (3.4 + 1.6 * Math.sin(Math.PI * Math.min(p, 1))) * (0.45 + 0.55 * bs.dVis / B.d0);
        if (bs.phase === "ignite") Rf *= lerp(0.35, 1, bs.flame);
        RfNow = Math.max(Rf, rNow * 1.6);
        const flick = 0.92 + 0.08 * Math.sin(et * 9.0) * Math.sin(et * 5.3 + 0.7);
        flame.scale.setScalar(RfNow); flame.material.uniforms.uTime.value = et;
        flame.material.uniforms.uIntensity.value = bs.flame * 0.85 * flick;
        soot.scale.setScalar(RfNow * 0.62); soot.material.uniforms.uTime.value = et * 1.3;
        soot.material.uniforms.uIntensity.value = heptane ? bs.flame * 0.22 * (1 - 0.6 * p) * flick : 0;
        fhalo.scale.setScalar(RfNow * 2.4); fhalo.quaternion.copy(camera.quaternion); fhalo.material.uniforms.uIntensity.value = bs.flame * 0.13;
        flame.visible = soot.visible = fhalo.visible = bs.flame > 0.002;
        flameLight.intensity = bs.flame * 1.4 + hot * 0.6; flameLight.color.setRGB(lerp(1.0, 0.35, bs.flame), lerp(0.55, 0.5, bs.flame), lerp(0.2, 1.0, bs.flame));
        dropMat.emissive.setRGB(0.05 * bs.flame + 0.25 * hot, 0.08 * bs.flame + 0.1 * hot, 0.22 * bs.flame + 0.02 * hot);
        dropRim.material.uniforms.uIntensity.value = 0.35 + 0.5 * bs.flame;
        // cool flame (heptane, after visible extinction): very faint
        const ca = bs.coolA * (0.85 + 0.15 * Math.sin(et * 1.7));
        cool.scale.setScalar(rNow * 3.2); cool.material.uniforms.uTime.value = et * 0.6; cool.material.uniforms.uIntensity.value = ca * 0.11;
        coolHalo.scale.setScalar(rNow * 6); coolHalo.quaternion.copy(camera.quaternion); coolHalo.material.uniforms.uIntensity.value = ca * 0.05;
        cool.visible = coolHalo.visible = ca > 0.002;
        diffusion(dt, bs.phase === "burn" ? 1 : 0);
        // scale bar: pixels per mm at the droplet
        pA.set(0, 0, 0).project(camera); pB.set(1, 0, 0).applyQuaternion(camera.quaternion).project(camera);
        const px = Math.abs(pB.x - pA.x) * 0.5 * innerWidth;
        const mm = px < 25 ? 5 : px < 50 ? 2 : 1;
        sbI.style.width = (px * mm).toFixed(1) + "px"; sbS.textContent = mm + " mm";
      },
    };
  }

  /* ---------- assemble */
  const s1 = sceneEarth(), s2 = sceneOrbit(), cab = cabin(), s4 = sceneDroplet();
  const scenes = [s1, s2, cab.intro, s4, cab.spark];
  let composer = null, renderPass = null, bloom = null;
  if (PP && PP.EffectComposer) {
    try {
      composer = new PP.EffectComposer(renderer);
      renderPass = new PP.RenderPass(s1.scene, camera); composer.addPass(renderPass);
      bloom = new PP.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.5, 0.8); composer.addPass(bloom);
      composer.addPass(new PP.OutputPass());
    } catch (e) { console.warn("bloom disabled", e); composer = null; }
  }
  const dbs = new THREE.Vector2();
  function resize() {
    renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight, false);
    if (composer) { composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight); }
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  const ptr = { x: 0, y: 0, sx: 0, sy: 0 };
  addEventListener("pointermove", e => { ptr.x = e.clientX / innerWidth * 2 - 1; ptr.y = e.clientY / innerHeight * 2 - 1; });
  let cur = -1, slow = 0;
  return {
    enter(i, t) {
      cur = i; const sc = scenes[i];
      camera.fov = sc.fov; camera.near = sc.near; camera.far = sc.far; camera.updateProjectionMatrix();
      renderer.toneMappingExposure = sc.exposure;
      if (bloom) { bloom.strength = sc.bloom[0]; bloom.radius = sc.bloom[1]; bloom.threshold = sc.bloom[2]; }
      if (renderPass) renderPass.scene = sc.scene;
      if (sc.enter) sc.enter(t);
    },
    update(i, t, dt, et) {
      if (i !== cur) this.enter(i, t);
      const sc = scenes[i];
      sc.update(t, dt, et);
      ptr.sx += (ptr.x - ptr.sx) * Math.min(1, dt * 2.5); ptr.sy += (ptr.y - ptr.sy) * Math.min(1, dt * 2.5);
      camera.rotateY(-ptr.sx * 0.025); camera.rotateX(-ptr.sy * 0.018);
      renderer.getDrawingBufferSize(dbs); U_SCALE.value = dbs.y / (2 * Math.tan(camera.fov * Math.PI / 360));
      if (composer) composer.render(); else renderer.render(sc.scene, camera);
      updateLabels(i, t);
      // keep it smooth on slow machines (never while taking test screenshots)
      if (!SHOT) { slow = dt > 0.045 ? slow + dt : Math.max(0, slow - dt * 0.5);
        if (slow > 2.5) { slow = 0; if (pr > 1) { pr = 1; resize(); } else if (composer) { composer = null; } } }
    },
  };
}

window.__ignis = { S, B, P };
boot();
</script>
